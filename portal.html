<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MECRO | Aula Virtual Aeroespacial</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  
  <style>
    :root {
      /* Paleta Premium - Dark Slate/Cyan */
      --mecro-bg-dark: #07090c;
      --mecro-bg-main: #0f172a;
      --mecro-bg-sidebar: #0b0f19;
      --mecro-bg-card: rgba(30, 41, 59, 0.7); 
      
      --mecro-accent: #00f0ff;
      --mecro-accent-gradient: linear-gradient(135deg, #00f0ff 0%, #0080ff 100%);
      
      --mecro-line: rgba(255, 255, 255, 0.12);
      --mecro-line-light: rgba(255, 255, 255, 0.2);
      
      --mecro-text-white: #ffffff;
      --mecro-text-gray: #cbd5e1;
      --mecro-text-dim: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    
    body { 
      background-color: var(--mecro-bg-dark); 
      color: var(--mecro-text-gray); 
      display: flex; flex-direction: column; height: 100vh; overflow: hidden; 
    }

    /* Animaciones Generales */
    @keyframes fadeUp {
      0% { opacity: 0; transform: translateY(20px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    .animate-fade { animation: fadeUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

    /* Header */
    header {
      height: 65px; background: var(--mecro-bg-sidebar); border-bottom: 1px solid var(--mecro-line);
      display: flex; align-items: center; justify-content: space-between; padding: 0 2rem;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4); z-index: 10;
    }
    .brand { font-weight: 800; font-size: 1.2rem; letter-spacing: 1px; color: var(--mecro-text-white); }
    .brand span { background: var(--mecro-accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .user-info { display: flex; align-items: center; gap: 1rem; font-size: 0.9rem; color: var(--mecro-text-gray); font-weight: 500;}
    
    .btn-logout { background: transparent; border: 1px solid var(--mecro-line); color: var(--mecro-text-gray); padding: 0.4rem 1rem; border-radius: 8px; cursor: pointer; transition: all 0.3s ease; }
    .btn-logout:hover { border-color: #ff4757; color: #ff4757; background: rgba(255, 71, 87, 0.1); }

    /* Group Badge */
    .group-badge {
      background: rgba(0, 240, 255, 0.15); border: 1px solid var(--mecro-accent); color: var(--mecro-accent);
      padding: 0.2rem 0.6rem; border-radius: 20px; font-size: 0.75rem; font-weight: 700; letter-spacing: 1px;
    }

    /* Layout Main */
    .app-container { display: flex; flex: 1; overflow: hidden; }

    /* Sidebar Navigation */
    aside {
      width: 320px; background: linear-gradient(to bottom, var(--mecro-bg-sidebar), var(--mecro-bg-dark));
      border-right: 1px solid var(--mecro-line); display: flex; flex-direction: column; overflow-y: auto;
    }
    .sidebar-title { padding: 1.5rem 1.5rem 0.5rem; font-size: 0.75rem; text-transform: uppercase; color: var(--mecro-text-dim); letter-spacing: 1px; font-weight: 700; }
    .nav-list { list-style: none; padding: 0.5rem; }
    .nav-item { padding: 1rem 1.2rem; margin-bottom: 0.3rem; border-radius: 10px; cursor: pointer; transition: all 0.3s ease; border: 1px solid transparent; }
    .nav-item:hover { background: rgba(255,255,255,0.03); border-color: var(--mecro-line); transform: translateX(5px); }
    .nav-item.active { background: linear-gradient(90deg, rgba(0, 240, 255, 0.1) 0%, transparent 100%); border-left: 4px solid var(--mecro-accent); border-radius: 4px 10px 10px 4px; }
    .week-code { font-family: 'Fira Code', monospace; font-size: 0.75rem; color: var(--mecro-accent); font-weight: 600; }
    .week-name { font-size: 0.95rem; font-weight: 600; margin-top: 0.3rem; color: var(--mecro-text-white); }

    /* Main Content Area */
    main { flex: 1; padding: 2.5rem 3rem; overflow-y: auto; background: radial-gradient(circle at top right, #162238, var(--mecro-bg-main)); }
    .content-header { margin-bottom: 2.5rem; border-bottom: 1px solid var(--mecro-line); padding-bottom: 1.5rem; display: flex; justify-content: space-between; align-items: flex-start;}
    .content-title { font-size: 2rem; font-weight: 800; color: var(--mecro-text-white); margin-top: 0.5rem;}
    .content-subtitle { color: var(--mecro-text-gray); margin-top: 0.5rem; font-size: 1rem; line-height: 1.5;}

    /* Cards & Grid */
    .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 1.5rem; margin-bottom: 2rem; }
    .card { background: var(--mecro-bg-card); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid var(--mecro-line); border-radius: 16px; padding: 2rem; transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease; }
    .card:hover { transform: translateY(-5px); box-shadow: 0 15px 35px -10px rgba(0, 0, 0, 0.5); border-color: var(--mecro-line-light); }
    .card-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 1rem; color: var(--mecro-text-white); display: flex; align-items: center; gap: 0.6rem; }
    
    /* Botones */
    .btn-action { display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; width: 100%; padding: 0.9rem; background: var(--mecro-accent-gradient); color: #000; font-weight: 700; border-radius: 10px; text-decoration: none; transition: all 0.3s ease; border: none; cursor: pointer; box-shadow: 0 4px 15px rgba(0, 240, 255, 0.2); }
    .btn-action:hover { box-shadow: 0 6px 20px rgba(0, 240, 255, 0.4); transform: scale(1.02); }
    .btn-secondary { background: rgba(255,255,255,0.05); border: 1px solid var(--mecro-line-light); color: var(--mecro-text-white); box-shadow: none; }
    .btn-secondary:hover { border-color: var(--mecro-text-white); background: rgba(255,255,255,0.1); color: var(--mecro-text-white); }

    /* Resource List */
    .resource-list { list-style: none; display: flex; flex-direction: column; gap: 1rem; }
    .resource-item { display: flex; align-items: center; justify-content: space-between; padding: 1rem; background: rgba(0,0,0,0.2); border-radius: 12px; border: 1px solid var(--mecro-line); transition: background 0.3s; }
    .resource-item:hover { background: rgba(255,255,255,0.05); }

    .input-gray { width: 100%; padding: 1rem; background: rgba(15, 23, 42, 0.8); border: 1px solid var(--mecro-line-light); border-radius: 10px; color: var(--mecro-text-white); outline: none; transition: all 0.3s ease; }
    .input-gray:focus { border-color: var(--mecro-accent); box-shadow: 0 0 0 3px rgba(0, 240, 255, 0.1); }
  </style>
</head>
<body>

  <div id="loginModal" class="modal-overlay" style="display: none;"></div>

  <header>
    <div class="brand">MECRO <span>ACADEMY</span></div>
    <div class="user-info">
      <span id="userGroupBadge" class="group-badge">G1</span>
      <span id="userName"><i class="ph ph-user-circle text-xl"></i> Alumno</span>
      <button class="btn-logout" onclick="logout()">Cerrar Sesión</button>
    </div>
  </header>

  <div class="app-container">
    <aside>
      <div class="sidebar-title">Ruta de Aprendizaje</div>
      <ul class="nav-list" id="navList"></ul>
    </aside>

    <main>
      <div id="mainView"></div>
    </main>
  </div>

  <script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwbHNi4FL-FQv5DMPCMJPphT626ICMC3pPUf6G_VCIoOYSI7DLgEg4w8h5kYOJRG04sbg/exec";

    // Modificado para soportar G1 y G2
    const syllabus = [
      {
        code: "S1", title: "Fundamentos de Arquitectura UAV",
        focus: "Topología de un multirrotor. Flujo de potencia y datos lógico.",
        meetLinkG1: "https://meet.google.com/cmk-ypmg-prs", 
        meetLinkG2: "https://meet.google.com/qiu-mjck-bvi", // CÁMBIALO
        pptLink: "https://docs.google.com/presentation/d/1ytbhvT98pBsXEJNu-x70L4DjCaYVMg8q-jTXju5PMdQ/edit?usp=sharing",
        videoLinkG1: "https://drive.google.com/file/d/1hgjuOVhw-NNp9YHIP_zZEEM7NoCsPwFY/preview",
        videoLinkG2: "https://drive.google.com/file/d/1hgjuOVhw-NNp9YHIP_zZEEM7NoCsPwFY/preview" // CÁMBIALO
      },
      {
        code: "S2", title: "Criterios de Selección de Aviónica",
        focus: "Análisis de especificaciones técnicas. Estándares RF y latencia.",
        meetLinkG1: "https://meet.google.com/cmk-ypmg-prs", 
        meetLinkG2: "https://meet.google.com/qiu-mjck-bvi", 

        pptLink: "https://docs.google.com/presentation/d/1ytbhvT98pBsXEJNu-x70L4DjCaYVMg8q-jTXju5PMdQ/edit?usp=sharing", 

        videoLinkG1: "https://drive.google.com/file/d/1szZVXn9CEnhJnoWkNdD2l6kCnivD8oZ6/preview", 
        videoLinkG2: "https://drive.google.com/file/d/12HWPsjzG9pxCjxF9c_uMV9zaECN37Iov/preview"
      },
      {
        code: "S3", title: "Simulación y enlace de control",
        focus: "Radiofrecuencia y Enlace de Control.",
        meetLinkG1: "https://meet.google.com/cmk-ypmg-prs", 
        meetLinkG2: "https://meet.google.com/qiu-mjck-bvi", 

        pptLink: "https://docs.google.com/presentation/d/1BWznQygHr-lzZXu-2hAysfNZglAWAQ3GxTMewTGqxM4/edit?usp=sharing", 

        videoLinkG1: "https://drive.google.com/file/d/12HWPsjzG9pxCjxF9c_uMV9zaECN37Iov/preview", 
        videoLinkG2: ""
      },
      // ... Rellena las otras semanas con el mismo formato (G1 y G2)
    ];

    let currentView = 'info'; 

    function logout() {
      localStorage.removeItem('mecro_user');
      window.location.href = 'login.html'; 
    }

    function initApp() {
      const user = JSON.parse(localStorage.getItem('mecro_user'));
      
      // Si no hay usuario logueado en localStorage, mandarlo a login
      if (!user) {
        window.location.href = 'login.html';
        return;
      }
      
      // Renderizar datos del usuario logueado
      document.getElementById('userName').innerHTML = `<i class="ph ph-user-circle text-xl"></i> ${user.nombre}`;
      // Si el grupo no está definido en Sheets, asume G1 por seguridad
      const userGroup = user.grupo || 'G1'; 
      document.getElementById('userGroupBadge').textContent = `GRUPO ${userGroup}`;

      changeView('info');
    }

    function changeView(view) {
      currentView = view;
      renderSidebar();
      
      const mainView = document.getElementById('mainView');
      mainView.classList.remove('animate-fade');
      void mainView.offsetWidth; 
      mainView.classList.add('animate-fade');
      
      if (view === 'info') renderInfo();
      else if (view === 'biblio') renderBiblio();
      else renderContent(view);
    }

    function renderSidebar() {
      const navList = document.getElementById('navList');
      navList.innerHTML = '';

      navList.innerHTML += `
        <li class="nav-item ${currentView === 'info' ? 'active' : ''}" onclick="changeView('info')">
          <div class="week-code">INICIO</div>
          <div class="week-name">Información del Curso</div>
        </li>
      `;

      syllabus.forEach((item, idx) => {
        navList.innerHTML += `
          <li class="nav-item ${currentView === idx ? 'active' : ''}" onclick="changeView(${idx})">
            <div class="week-code">${item.code}</div>
            <div class="week-name">${item.title}</div>
          </li>
        `;
      });

      navList.innerHTML += `
        <li class="nav-item ${currentView === 'biblio' ? 'active' : ''}" onclick="changeView('biblio')">
          <div class="week-code">RECURSOS</div>
          <div class="week-name">Bibliografía & Software</div>
        </li>
      `;
    }

    function renderInfo() {
      const main = document.getElementById('mainView');
      main.innerHTML = `
        <div class="content-header">
          <div>
            <div class="week-code">VISIÓN GENERAL</div>
            <h1 class="content-title">Ingeniería y Ensamblaje de Drones</h1>
            <p class="content-subtitle">Capacitación técnica en Hardware, Control PID y Cinemática de Vuelo.</p>
          </div>
        </div>

        <div class="card" style="margin-bottom: 2rem;">
          <img src="./images/curso-drones.jpg" alt="Drone Course" style="width: 100%; height: 300px; object-fit: cover; border-radius: 12px; margin-bottom: 1.5rem; box-shadow: 0 10px 20px rgba(0,0,0,0.3);" onerror="this.style.display='none'">
          
          <h2 style="color: var(--mecro-text-white); margin-bottom: 1rem; font-size: 1.5rem;">Sobre este programa</h2>
          <p style="color: var(--mecro-text-gray); line-height: 1.7; margin-bottom: 2rem; font-size: 1.05rem;">
            A lo largo de 8 semanas intensivas, dominaremos la arquitectura interna de un Vehículo Aéreo No Tripulado (UAV). Aterrizaremos la teoría aeronáutica en componentes reales, desde la interpretación de diagramas del Controlador de Vuelo, hasta la soldadura de potencia y configuración de los algoritmos PID en Betaflight.
          </p>

          <div style="background: rgba(15, 23, 42, 0.5); border: 1px solid var(--mecro-line); border-radius: 12px; padding: 1.5rem; display: flex; align-items: center; gap: 1.5rem;">
            <div style="width: 65px; height: 65px; border-radius: 50%; background: var(--mecro-accent-gradient); display: flex; align-items: center; justify-content: center; font-size: 2rem; color: #000;">
              <i class="ph ph-rocket-launch"></i>
            </div>
            <div>
              <h4 style="color: var(--mecro-text-white); font-weight: 800; font-size: 1.2rem;">Gerard</h4>
              <span style="color: var(--mecro-accent); font-size: 0.9rem; font-weight: 600;">Lead Engineer & Fundador en MECRO</span>
              <p style="color: var(--mecro-text-dim); font-size: 0.85rem; margin-top: 0.3rem;">Instructor de Sistemas Embebidos y Control Aeronáutico.</p>
            </div>
          </div>
        </div>
      `;
    }

    function renderContent(idx) {
      const main = document.getElementById('mainView');
      const item = syllabus[idx];

      // --- LOGICA CONDICIONAL POR GRUPOS ---
      const user = JSON.parse(localStorage.getItem('mecro_user'));
      const userGroup = user ? (user.grupo || 'G1') : 'G1'; 

      // Se selecciona dinámicamente según el grupo del alumno
      const currentMeetLink = userGroup === 'G2' ? item.meetLinkG2 : item.meetLinkG1;
      const currentVideoLink = userGroup === 'G2' ? item.videoLinkG2 : item.videoLinkG1;

      main.innerHTML = `
        <div class="content-header">
          <div>
            <div class="week-code">${item.code} - LABORATORIO TÉCNICO</div>
            <h1 class="content-title">${item.title}</h1>
            <p class="content-subtitle">${item.focus}</p>
          </div>
          <span class="group-badge" style="height: fit-content; margin-top: 0.5rem;"><i class="ph ph-users"></i> GRUPO ${userGroup}</span>
        </div>

        <div class="grid-2">
          <div class="card">
            <div class="card-title"><i class="ph ph-video-camera" style="color:var(--mecro-accent)"></i> Clase en Vivo</div>
            <p style="font-size:0.9rem; color:var(--mecro-text-gray); margin-bottom:1.5rem;">
              Enlace de acceso a la sesión asignada a tu grupo (Grupo ${userGroup}).
            </p>
            <a href="${currentMeetLink || '#'}" target="_blank" class="btn-action ${!currentMeetLink ? 'btn-secondary' : ''}">
              <i class="ph ph-link"></i> ${currentMeetLink ? 'Unirse a la Sesión' : 'Próximamente'}
            </a>
          </div>

          <div class="card">
            <div class="card-title"><i class="ph ph-presentation-chart" style="color:var(--mecro-accent)"></i> Diapositivas</div>
            <p style="font-size:0.9rem; color:var(--mecro-text-gray); margin-bottom:1.5rem;">
              Presentación y esquemáticos discutidos durante el laboratorio.
            </p>
            <a href="${item.pptLink || '#'}" target="_blank" class="btn-action btn-secondary">
              <i class="ph ph-monitor-play"></i> Ver en Google Slides
            </a>
          </div>
        </div>

        <div class="card" style="margin-bottom:2rem; padding:0; overflow:hidden;">
          <div style="padding: 1.5rem; border-bottom: 1px solid var(--mecro-line);">
            <div class="card-title" style="margin:0;"><i class="ph ph-film-strip"></i> Grabación de la Sesión (${userGroup})</div>
          </div>
          <div style="background:#000; height:500px; display:flex; align-items:center; justify-content:center;">
            ${currentVideoLink ? 
              `<iframe width="100%" height="100%" src="${currentVideoLink}" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>` : 
              `<span style="color:var(--mecro-text-dim);">La grabación del Grupo ${userGroup} estará disponible 2 hrs después de la clase.</span>`}
          </div>
          ${currentVideoLink ? `
          <div style="padding: 1rem 1.5rem; background: rgba(0,0,0,0.3); text-align:right;">
              <a href="${currentVideoLink.replace('/preview', '/view')}" target="_blank" style="font-size: 0.85rem; color: var(--mecro-accent); text-decoration: none; font-weight: 500;">
                 Abrir externamente en Google Drive ↗
              </a>
          </div>` : ''}
        </div>

        ${idx === 0 ? `
        <div class="card" style="margin-bottom: 2rem;">
          <div class="card-title">
            <i class="ph ph-files text-[var(--mecro-accent)]"></i> Documentación Oficial
          </div>
          <div class="grid-2" style="margin-bottom: 0; margin-top:1.5rem;">
            <div class="resource-item" style="flex-direction:column; align-items:flex-start; gap:1.2rem;">
              <div style="display:flex; align-items:center; gap:1rem;">
                <div style="padding: 0.8rem; background:rgba(255,255,255,0.1); border-radius:10px;"><i class="ph ph-file-pdf text-2xl text-white"></i></div>
                <div>
                  <h4 style="color:#fff; font-size:1rem; font-weight:700;">Sílabo del Curso</h4>
                  <span style="font-size:0.8rem; color:var(--mecro-text-dim);">Cronograma oficial.</span>
                </div>
              </div>
              <a href="#" class="btn-action btn-secondary" style="font-size: 0.85rem;"><i class="ph ph-download-simple"></i> Descargar</a>
            </div>
          </div>
        </div>
        ` : ''}

        <div class="card">
          <div class="card-title">
            <i class="ph ph-chats-circle text-[var(--mecro-accent)]"></i> Foro de Ingeniería
          </div>
          <p style="font-size:0.9rem; color:var(--mecro-text-gray); margin-bottom:1.5rem;">
            Deja tu duda sobre conectividad, hardware o control PID.
          </p>

          <form id="forumForm" style="margin-bottom:2.5rem;">
            <textarea id="forumQuestion" rows="3" class="input-gray" placeholder="Escribe tu consulta detallada..." required></textarea>
            <div style="display:flex; justify-content: flex-end; margin-top: 1rem;">
              <button type="submit" class="btn-action" style="width:auto; padding:0.7rem 1.5rem;">
                Publicar Consulta <i class="ph ph-paper-plane-right"></i>
              </button>
            </div>
          </form>

          <div id="forumList" style="display:flex; flex-direction:column; gap:1.2rem;">
            <div style="background: rgba(255,255,255,0.03); border: 1px solid var(--mecro-line); border-radius: 12px; padding: 1.2rem;">
              <div style="display:flex; justify-content:space-between; margin-bottom:0.8rem;">
                <strong style="color:var(--mecro-text-white);"><i class="ph ph-user-circle"></i> Ing. Alvaro Lopez</strong>
                <span style="font-size:0.8rem; color:var(--mecro-text-dim);">Hace 1 día</span>
              </div>
              <p style="color:var(--mecro-text-gray); margin-bottom:1.2rem; font-size: 0.95rem; line-height: 1.5;">
                ¿Cuál es la diferencia entre procesar señales analógicas vs usar DShot en el ESC?
              </p>
              <div style="background: rgba(0,0,0,0.3); border-left: 3px solid var(--mecro-accent); padding: 1rem; border-radius: 0 8px 8px 0;">
                <div style="color:var(--mecro-accent); font-weight:700; font-size:0.85rem; margin-bottom:0.5rem; display:flex; align-items:center; gap:0.4rem;">
                  <i class="ph ph-seal-check"></i> Instructor MECRO
                </div>
                <p style="font-size:0.9rem; color:var(--mecro-text-white); line-height: 1.5;">
                  DShot es digital y exento de ruido electromagnético. Elimina la necesidad de calibración del rango PWM.
                </p>
              </div>
            </div>
          </div>
        </div>
      `;

      const forumForm = document.getElementById('forumForm');
      if (forumForm) {
        forumForm.addEventListener('submit', (e) => {
          e.preventDefault();
          const txt = document.getElementById('forumQuestion').value;
          if(!txt.trim()) return;

          const forumList = document.getElementById('forumList');
          const newPost = document.createElement('div');
          
          newPost.style.cssText = "background: rgba(255,255,255,0.03); border: 1px solid var(--mecro-line); border-radius: 12px; padding: 1.2rem; animation: fadeUp 0.3s ease-out forwards;";
          newPost.innerHTML = `
            <div style="display:flex; justify-content:space-between; margin-bottom:0.8rem;">
              <strong style="color:var(--mecro-text-white);"><i class="ph ph-user-circle"></i> ${user.nombre}</strong>
              <span style="font-size:0.8rem; color:var(--mecro-accent);">Justo ahora</span>
            </div>
            <p style="color:var(--mecro-text-gray); font-size: 0.95rem;">${txt}</p>
          `;
          
          forumList.prepend(newPost);
          document.getElementById('forumQuestion').value = "";
        });
      }
    }

    function renderBiblio() {
      const main = document.getElementById('mainView');
      main.innerHTML = `
        <div class="content-header">
          <div class="week-code">REPOSITORIO</div>
          <h1 class="content-title">Bibliografía y Software</h1>
        </div>
        <div class="card">
          <div class="card-title">Descargas Esenciales</div>
          <p style="color:var(--mecro-text-gray); margin-bottom: 2rem;">Enlaces directos oficiales.</p>
          <ul class="resource-list">
            <li class="resource-item">
              <div>
                <h4 style="color:#fff;">Betaflight Configurator</h4>
                <p style="color:var(--mecro-text-dim); font-size:0.85rem;">Configurador FC.</p>
              </div>
