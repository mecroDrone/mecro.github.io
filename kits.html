 * Arquitectura: Máquina de Estados No Bloqueante
 * Hardware: ESP32 DevKit V1
 */

// --- 1. DEFINICIÓN DE HARDWARE (MAPPING) ---
// Usamos constantes para ahorrar RAM (Flash memory)
const int PIN_ROJO     = 23; // GPIO 23
const int PIN_AMARILLO = 22; // GPIO 22
const int PIN_VERDE    = 21; // GPIO 21

// --- 2. CONFIGURACIÓN DE TIEMPOS (TIMING) ---
// Tiempos en milisegundos
const unsigned long TIEMPO_ROJO     = 3000; // 3 segundos
const unsigned long TIEMPO_VERDE    = 3000; // 3 segundos
const unsigned long TIEMPO_AMARILLO = 1000; // 1 segundo

// --- 3. VARIABLES DEL SISTEMA ---
// 'unsigned long' es vital para evitar el desbordamiento de millis()
unsigned long tiempoAnterior = 0; 
int estadoActual = 0; // 0:Rojo, 1:Verde, 2:Amarillo

void setup() {
  // Configurar pines como salida digital
  pinMode(PIN_ROJO, OUTPUT);
  pinMode(PIN_AMARILLO, OUTPUT);
  pinMode(PIN_VERDE, OUTPUT);

  // Estado inicial seguro: Todo apagado
  digitalWrite(PIN_ROJO, LOW);
  digitalWrite(PIN_AMARILLO, LOW);
  digitalWrite(PIN_VERDE, LOW);

  Serial.begin(115200);
  Serial.println("--- MECRO SYSTEM: TRAFFIC CONTROL ONLINE ---");
}

void loop() {
  // Capturamos el "instante" actual
  unsigned long tiempoActual = millis();

  // MÁQUINA DE ESTADOS FINITOS (FSM)
  switch (estadoActual) {
    
    // --- ESTADO 0: ROJO (ALTO) ---
    case 0:
      digitalWrite(PIN_ROJO, HIGH);
      digitalWrite(PIN_AMARILLO, LOW);
      digitalWrite(PIN_VERDE, LOW);

      // Lógica no bloqueante: ¿Pasó el tiempo?
      if (tiempoActual - tiempoAnterior >= TIEMPO_ROJO) {
        estadoActual = 1; // Transición a Verde
        tiempoAnterior = tiempoActual; // Reset cronómetro
        Serial.println("Estado: VERDE (Go)");
      }
      break;

    // --- ESTADO 1: VERDE (AVANCE) ---
    case 1:
      digitalWrite(PIN_ROJO, LOW);
      digitalWrite(PIN_AMARILLO, LOW);
      digitalWrite(PIN_VERDE, HIGH);

      if (tiempoActual - tiempoAnterior >= TIEMPO_VERDE) {
        estadoActual = 2; // Transición a Amarillo
        tiempoAnterior = tiempoActual;
        Serial.println("Estado: AMARILLO (Warning)");
      }
      break;

    // --- ESTADO 2: AMARILLO (PRECAUCIÓN) ---
    case 2:
      digitalWrite(PIN_ROJO, LOW);
      digitalWrite(PIN_AMARILLO, HIGH);
      digitalWrite(PIN_VERDE, LOW);

      if (tiempoActual - tiempoAnterior >= TIEMPO_AMARILLO) {
        estadoActual = 0; // Vuelta a Rojo
        tiempoAnterior = tiempoActual;
        Serial.println("Estado: ROJO (Stop)");
      }
      break;
  }
}`,

            code: `/* * MECRO KIT - PROYECTO 02: PIANO ELECTRÓNICO
 * Objetivo: Generación de ondas cuadradas (Sonido) usando PWM (LEDC)
 * Hardware: ESP32, Buzzer Pasivo, 3 Pulsadores
 */

// --- 1. DEFINICIONES DE PINES ---
const int PIN_BUZZER = 19;
const int BTN_DO = 4;
const int BTN_RE = 5;
const int BTN_MI = 18;

// --- 2. FRECUENCIAS MUSICALES (Hertz) ---
// Escala 4 (Octava Central)
const int NOTA_DO = 261;
const int NOTA_RE = 294;
const int NOTA_MI = 329;

// --- 3. CONFIGURACIÓN PWM (LEDC) ---
const int CANAL_PWM = 0;      // El ESP32 tiene 16 canales (0-15)
const int FREC_BASE = 2000;   // Frecuencia inicial (no importa mucho, la cambiaremos)
const int RESOLUCION = 8;     // 8 bits (0-255)

void setup() {
  // Configurar botones con resistencia interna (Pull-Up)
  // Al presionar, el pin leerá LOW (GND)
  pinMode(BTN_DO, INPUT_PULLUP);
  pinMode(BTN_RE, INPUT_PULLUP);
  pinMode(BTN_MI, INPUT_PULLUP);

  // Configurar el periférico de LED Control (LEDC)
  ledcSetup(CANAL_PWM, FREC_BASE, RESOLUCION);
  
  // Conectar el canal al pin del buzzer
  ledcAttachPin(PIN_BUZZER, CANAL_PWM);
  
  Serial.begin(115200);
  Serial.println("MECRO Piano Iniciado");
}

void loop() {
  // Leemos los botones (Lógica Inversa: LOW = Presionado)
  
  if (digitalRead(BTN_DO) == LOW) {
    // Tocar DO: Frecuencia 261Hz
    ledcWriteTone(CANAL_PWM, NOTA_DO);
    Serial.println("Nota: DO");
  } 
  else if (digitalRead(BTN_RE) == LOW) {
    ledcWriteTone(CANAL_PWM, NOTA_RE);
    Serial.println("Nota: RE");
  }
  else if (digitalRead(BTN_MI) == LOW) {
    ledcWriteTone(CANAL_PWM, NOTA_MI);
    Serial.println("Nota: MI");
  }
  else {
    // Silencio: Frecuencia 0
    ledcWriteTone(CANAL_PWM, 0);
  }
  
  // Pequeño delay para estabilidad (Debounce simple)
  delay(10);
}`,

const int UMBRAL_APAGAR = 1800;   // Si sube de esto, apaga

     luzEncendida = false;

  0b1111111, // 8

const int PIN_TRIG = 5;
const int PIN_ECHO = 18;
const int PIN_CLK  = 19;

void setup() {
  Serial.begin(115200);
  
  pinMode(PIN_TRIG, OUTPUT);
  pinMode(PIN_ECHO, INPUT);
  
  display.setBrightness(0x0f); // Brillo máximo

  // 1. Generar pulso de Trigger (10 microsegundos)

            code: `/* * MECRO KIT - PROYECTO 07: ESTACIÓN DE CLIMA
 * Objetivo: Lectura de sensores ambientales y visualización I2C
 * Hardware: ESP32, DHT11, OLED SSD1306
 * Librerías: Adafruit SSD1306, Adafruit GFX, DHT sensor library
 */

#include <Wire.h>
#include <Adafruit_GFX.h>
#include <Adafruit_SSD1306.h>
#include <DHT.h>

// --- 1. CONFIGURACIÓN OLED ---
#define SCREEN_WIDTH 128
#define SCREEN_HEIGHT 64
#define OLED_RESET    -1
Adafruit_SSD1306 display(SCREEN_WIDTH, SCREEN_HEIGHT, &Wire, OLED_RESET);

// --- 2. CONFIGURACIÓN DHT ---
#define DHTPIN 15     // Pin donde está conectado el DHT11
#define DHTTYPE DHT11 // Tipo de sensor
DHT dht(DHTPIN, DHTTYPE);

void setup() {
  Serial.begin(115200);
  
  // Iniciar sensor DHT
  dht.begin();
  
  // Iniciar pantalla OLED (Dirección 0x3C es estándar)
  if(!display.begin(SSD1306_SWITCHCAPVCC, 0x3C)) {
    Serial.println(F("Fallo al iniciar OLED"));
    for(;;); // Bucle infinito si falla
  }
  
  display.clearDisplay();
  display.setTextSize(1);
  display.setTextColor(WHITE);
  display.setCursor(0,0);
  display.println("MECRO CLIMA v1.0");
  display.display();
  delay(2000);
}

void loop() {
  // Leer humedad y temperatura
  // ¡OJO! Esto toma unos 250ms
  float h = dht.readHumidity();
  float t = dht.readTemperature(); // Celsius

  // Verificar si hubo error de lectura (NaN = Not a Number)
  if (isnan(h) || isnan(t)) {
    Serial.println(F("Fallo lectura DHT!"));
    return;
  }

  // Mostrar en Serial
  Serial.print(F("Humedad: ")); Serial.print(h);
  Serial.print(F("%  Temp: ")); Serial.print(t); Serial.println(F("°C"));

  // Mostrar en OLED
  display.clearDisplay();
  
  // Título
  display.setTextSize(1);
  display.setCursor(0,0);
  display.print("MECRO Estacion");
  
  // Temperatura (Grande)
  display.setTextSize(2);
  display.setCursor(0, 16);
  display.print(t, 1); // 1 decimal
  display.print(" C");
  display.drawCircle(60, 18, 3, WHITE); // Símbolo grado
  
  // Humedad
  display.setTextSize(2);
  display.setCursor(0, 40);
  display.print(h, 0); // 0 decimales
  display.print(" %RH");
  
  display.display(); // Enviar buffer a pantalla
  
  delay(2000); // El DHT11 es lento, esperar 2s
}`,

            code: `/* * MECRO KIT - PROYECTO 08: CAJA FUERTE (KEYPAD)

const byte ROWS = 4; // 4 filas

char keys[ROWS][COLS] = {
  {'1','2','3','A'},
  {'4','5','6','B'},
  {'7','8','9','C'},
  {'*','0','#','D'}
};

// Pines (Ajustar según conexión)
byte rowPins[ROWS] = {13, 12, 14, 27}; 
byte colPins[COLS] = {26, 25, 33, 32}; 

Keypad keypad = Keypad(makeKeymap(keys), rowPins, colPins, ROWS, COLS);

// --- 2. LÓGICA DE SEGURIDAD ---
String password = "1234"; // Clave correcta
String inputParams = "";  // Buffer de entrada
const int PIN_RELAY = 4;
const int PIN_BUZZER = 19;

void setup() {
  Serial.begin(115200);
  pinMode(PIN_RELAY, OUTPUT);
  pinMode(PIN_BUZZER, OUTPUT);
  
  digitalWrite(PIN_RELAY, LOW); // Cerrado al inicio
  Serial.println("Sistema de Seguridad Activo");
}

void loop() {
  char key = keypad.getKey(); // Leer tecla
  
  if (key) {
    Serial.println(key);
    tone(PIN_BUZZER, 2000, 50); // Feedback sonoro "beep"
    
    if (key == '#') { // Tecla '#' para confirmar (Enter)
      checkPassword();
    } 
    else if (key == '*') { // Tecla '*' para borrar (Clear)
      inputParams = "";
      Serial.println("Entrada borrada");
    }
    else {
      inputParams += key; // Agregar caracter al buffer
    }
  }
}

void checkPassword() {
  if (inputParams == password) {
    Serial.println("Acceso Concedido");
    tone(PIN_BUZZER, 3000, 100); delay(150); tone(PIN_BUZZER, 3000, 100);
    digitalWrite(PIN_RELAY, HIGH); // Abrir cerradura
    delay(3000); // Mantener abierto 3 segundos
    digitalWrite(PIN_RELAY, LOW);  // Cerrar
  } else {
    Serial.println("Acceso Denegado");
    tone(PIN_BUZZER, 500, 1000); // Sonido de error largo
  }
  inputParams = ""; // Limpiar buffer
}`,

    noTone(PIN_BUZZER); // Apagar sonido
    
    if (estadoPIR == HIGH) {

            code: `/* * MECRO KIT - PROYECTO 10: VENTILADOR INTELIGENTE
 * Objetivo: Control de Potencia y Lazo Cerrado con Histéresis
 * Hardware: ESP32, DHT11, Motor DC, Transistor NPN (2N2222/TIP120), Diodo
 */

#include <DHT.h>

const int PIN_DHT = 15;
const int PIN_MOTOR = 26;

// Configuración del Termostato
const float TEMP_SETPOINT = 25.0; // Temperatura deseada
const float HISTERESIS = 1.0;     // Margen para evitar rebote

// Límites calculados
const float LIMITE_ON = TEMP_SETPOINT + HISTERESIS; // 26.0°C
const float LIMITE_OFF = TEMP_SETPOINT - HISTERESIS; // 24.0°C

#define DHTTYPE DHT11
DHT dht(PIN_DHT, DHTTYPE);

void setup() {
  Serial.begin(115200);
  pinMode(PIN_MOTOR, OUTPUT);
  digitalWrite(PIN_MOTOR, LOW); // Motor apagado por seguridad al inicio
  
  dht.begin();
  Serial.println("--- MECRO Climate Control Activo ---");
}

void loop() {
  // Leer temperatura (DHT11 es lento, toma ~250ms)
  float t = dht.readTemperature();

  // Validación de seguridad: Si el sensor falla, apagar motor
  if (isnan(t)) {
    Serial.println("¡ERROR SENSOR! Apagando sistema...");
    digitalWrite(PIN_MOTOR, LOW);
    return;
  }

  Serial.print("Temperatura: ");
  Serial.print(t);
  Serial.println(" °C");

  // Lógica de Control con Histéresis (Schmitt Trigger)
  // Esto evita que el motor se prenda/apague 10 veces por segundo si T=25.0
  
  if (t >= LIMITE_ON) {
    digitalWrite(PIN_MOTOR, HIGH); // Encender
    Serial.println("-> Calor detectado: VENTILADOR ON");
  } 
  else if (t <= LIMITE_OFF) {
    digitalWrite(PIN_MOTOR, LOW);  // Apagar
    Serial.println("-> Temperatura baja: VENTILADOR OFF");
  }
  // Nota: Entre 24.0 y 26.0, el motor MANTIENE su estado anterior (Estabilidad)

  delay(2000); // Esperar 2s entre lecturas
}`,

// Función auxiliar para medir distancia
int obtenerDistancia() {
  digitalWrite(PIN_TRIG, LOW);
  delayMicroseconds(2);
  digitalWrite(PIN_TRIG, HIGH);
  delayMicroseconds(10);
  digitalWrite(PIN_TRIG, LOW);
  
  long duracion = pulseIn(PIN_ECHO, HIGH);
  int distanciaCm = duracion * 0.034 / 2;
  
  // Limitar rango para dibujo (max 60cm en pantalla)
  if (distanciaCm > 60) distanciaCm = 60;
  if (distanciaCm < 0) distanciaCm = 60;
  
  return distanciaCm;
}

void loop() {

    // 2. Calcular vector de barrido (Aguja)
    // Convertir a Radianes
    float rad = angulo * PI / 180.0;
    
    // Coordenadas Polares -> Cartesianas
    // x = r * cos(theta), y = r * sin(theta)
    int lineaX = 64 - (60 * cos(rad));
    int lineaY = 64 - (60 * sin(rad));
    
    display.drawLine(64, 64, lineaX, lineaY, WHITE);
    
    // 3. Dibujar Objeto si está dentro del rango
    if(distancia < 60) {
       int objX = 64 - (distancia * cos(rad));
       int objY = 64 - (distancia * sin(rad));
       display.fillCircle(objX, objY, 4, WHITE); // Punto gordo para el objeto
    }
    
    // Texto informativo
    display.setCursor(0,0);
    display.print("Ang: "); display.print(angulo);
    display.setCursor(80,0);
    display.print("Dist: "); display.print(distancia);
    
    display.display();
  }
  
  // Retorno rápido al inicio
  for(int angulo = 165; angulo >= 15; angulo -= 5) {

            code: `/* * MECRO KIT - PROYECTO 12: BRAZO ROBÓTICO (CONTROL SERVO)
 * Objetivo: ADC Mapping y Control PWM de Servos
 * Librerías: ESP32Servo (Gestión de Timers PWM)
 */
#include <ESP32Servo.h>

Servo myServo;

// Definiciones de Hardware
const int PIN_POT = 34;   // Entrada analógica (Potenciómetro)
const int PIN_SERVO = 13; // Salida PWM (Servo)

// Variables para el filtro de promedio (Anti-Jitter)
const int NUM_LECTURAS = 10;
int lecturas[NUM_LECTURAS];
int indiceLectura = 0;
long total = 0;
int promedio = 0;

void setup() {
  Serial.begin(115200);
  
  // Configuración del Servo
  // Los servos SG90 suelen trabajar entre 500us y 2400us
  myServo.attach(PIN_SERVO, 500, 2400);
  
  // Inicializar array de lecturas en 0
  for (int i = 0; i < NUM_LECTURAS; i++) lecturas[i] = 0;
  
  Serial.println("Control de Servo Iniciado");
}

void loop() {
  // --- 1. FILTRO DE PROMEDIO MÓVIL (Suavizado) ---
  // Restar la última lectura
  total = total - lecturas[indiceLectura];
  // Leer del sensor
  lecturas[indiceLectura] = analogRead(PIN_POT);
  // Sumar la nueva lectura
  total = total + lecturas[indiceLectura];
  // Avanzar al siguiente índice
  indiceLectura = indiceLectura + 1;
  // Si llegamos al final del array, volver al principio
  if (indiceLectura >= NUM_LECTURAS) indiceLectura = 0;
  // Calcular promedio
  promedio = total / NUM_LECTURAS;

  // --- 2. MAPEO DE SEÑAL ---
  // Convertir rango ADC (0-4095) a Rango Servo (0-180)
  int angulo = map(promedio, 0, 4095, 0, 180);
  
  // --- 3. ACTUAR ---
  myServo.write(angulo);
  
  // --- 4. TELEMETRÍA ---
  // Usar el plotter serial para ver la estabilidad
  Serial.print("Raw:");
  Serial.print(analogRead(PIN_POT)); // Valor crudo (ruidoso)
  Serial.print(" Smooth:");
  Serial.print(promedio);            // Valor suavizado
  Serial.print(" Angulo:");
  Serial.println(angulo);
  
  delay(15); // Pequeña espera para permitir que el servo llegue a la posición
}`,

#include <Stepper.h>

Stepper motor(PASOS_VUELTA, 19, 5, 18, 17);

const int PISO_1 = 0;
const int PISO_2 = 2048; // 1 Vuelta completa arriba

const int BTN_2 = 16;

  pinMode(BTN_2, INPUT_PULLUP);

void moverA(int destino, String nombrePiso) {

  int pasosAMover = destino - posicionActual;

  // Actualizar posición mental

  }

    moverA(PISO_3, "Piso 3");
  }
}`,

            code: `/* * MECRO KIT - PROYECTO 15: CONTROL DE MOTOR INDUSTRIAL
 * Objetivo: Puente H, Control Bidireccional y PWM
 * Hardware: ESP32, L293D, Motor DC, Potenciómetro, Switch
 */

// Pines L293D
const int PIN_ENABLE = 26; // PWM Velocidad
const int PIN_IN1 = 25;    // Dirección A
const int PIN_IN2 = 33;    // Dirección B

// Pines de Control
const int PIN_POT = 14;    // Potenciómetro
const int PIN_SW = 27;     // Switch Dirección

// Configuración PWM
const int CANAL_PWM = 0;
const int FREC_PWM = 5000; // 5kHz (Ideal para L293D)
const int RESOLUCION = 8;  // 8 bits (0-255)

void setup() {
  Serial.begin(115200);
  
  pinMode(PIN_IN1, OUTPUT);
  pinMode(PIN_IN2, OUTPUT);
  pinMode(PIN_SW, INPUT_PULLUP);
  
  // Configurar PWM en el pin Enable
  ledcSetup(CANAL_PWM, FREC_PWM, RESOLUCION);
  ledcAttachPin(PIN_ENABLE, CANAL_PWM);
  
  Serial.println("Control de Motor Industrial Iniciado");
}

void loop() {
  // 1. Leer Velocidad (Potenciómetro)
  int lecturaPot = analogRead(PIN_POT); // 0-4095
  int velocidadPWM = map(lecturaPot, 0, 4095, 0, 255); // Escalar a 8 bits
  
  // Aplicar velocidad (Zona muerta para evitar zumbidos a baja potencia)
  if (velocidadPWM < 20) velocidadPWM = 0;
  ledcWrite(CANAL_PWM, velocidadPWM);
  
  // 2. Leer Dirección (Switch)
  bool direccion = digitalRead(PIN_SW);
  
  if (direccion == HIGH) {
    // Giro Horario (CW)
    digitalWrite(PIN_IN1, HIGH);
    digitalWrite(PIN_IN2, LOW);
    Serial.print("DIR: Horario | ");
  } else {
    // Giro Anti-horario (CCW)
    digitalWrite(PIN_IN1, LOW);
    digitalWrite(PIN_IN2, HIGH);
    Serial.print("DIR: Anti-Horario | ");
  }
  
  Serial.print("PWM: ");
  Serial.println(velocidadPWM);
  
  delay(100);
}`,

            code: `/* * MECRO KIT - PROYECTO 16: NIVEL DE BURBUJA DIGITAL
 * Objetivo: Lectura de IMU (Acelerómetro) y visualización gráfica
 * Hardware: ESP32, MPU6050, OLED SSD1306
 * Librerías: Adafruit MPU6050, Adafruit Unified Sensor, Adafruit SSD1306
 */

#include <Adafruit_MPU6050.h>
#include <Adafruit_SSD1306.h>
#include <Wire.h>

Adafruit_MPU6050 mpu;
Adafruit_SSD1306 display(128, 64, &Wire, -1);

void setup() {
  Serial.begin(115200);

  // Iniciar OLED
  if(!display.begin(SSD1306_SWITCHCAPVCC, 0x3C)) {
    Serial.println("Fallo OLED");
    for(;;);
  }

  // Iniciar MPU6050
  if (!mpu.begin()) {
    Serial.println("Fallo MPU6050");
    while (1);
  }
  
  // Configuración del sensor para estabilidad
  mpu.setAccelerometerRange(MPU6050_RANGE_8_G);
  mpu.setFilterBandwidth(MPU6050_BAND_21_HZ);

  display.clearDisplay();
  display.setTextColor(WHITE);
  display.setCursor(20,20);
  display.print("Calibrando...");
  display.display();
  delay(1000);
}

void loop() {
  /* Obtener nuevos eventos del sensor */
  sensors_event_t a, g, temp;
  mpu.getEvent(&a, &g, &temp);

  // a.acceleration.x, .y, .z tienen los valores en m/s^2
  
  // Mapear aceleración a coordenadas de pantalla (128x64)
  // El rango típico de inclinación suave es -5 a 5 m/s^2
  // Centro de pantalla: 64, 32
  
  int x_pos = map((int)(a.acceleration.y * 10), -50, 50, 0, 128); // Invertir ejes según orientación
  int y_pos = map((int)(a.acceleration.x * 10), -50, 50, 0, 64);
  
  // Limitar bordes (Constrain)
  if(x_pos < 5) x_pos = 5;
  if(x_pos > 123) x_pos = 123;
  if(y_pos < 5) y_pos = 5;
  if(y_pos > 59) y_pos = 59;

  // Dibujar Nivel
  display.clearDisplay();
  
  // Dibujar Diana (Centro)
  display.drawCircle(64, 32, 10, WHITE);
  display.drawLine(64, 28, 64, 36, WHITE); // Cruz
  display.drawLine(60, 32, 68, 32, WHITE);
  
  // Dibujar "Burbuja" (Círculo lleno)
  // Nota: Una burbuja real va HACIA ARRIBA (contrario a gravedad). 
  // El acelerómetro mide fuerza, así que hay que ajustar la lógica.
  // Aquí dibujamos la "bolita" cayendo hacia la inclinación.
  display.fillCircle(x_pos, y_pos, 4, WHITE);
  
  // Datos numéricos
  display.setCursor(0,0);
  display.print("X:"); display.print(a.acceleration.x, 1);
  display.setCursor(64,0);
  display.print("Y:"); display.print(a.acceleration.y, 1);
  
  display.display();
  delay(50); // 20 FPS
}`,

            code: `/* * MECRO KIT - PROYECTO 17: MANDO DE VUELO (FLIGHT CONTROLLER)
 * Objetivo: Lectura de piloto + Sensores + Algoritmo Mixer
 * Hardware: ESP32, Joystick, MPU6050
 * Librerías: Adafruit MPU6050
 */

#include <Adafruit_MPU6050.h>
#include <Wire.h>

Adafruit_MPU6050 mpu;

// Pines Joystick
const int PIN_ROLL = 35;  // Eje X
const int PIN_PITCH = 34; // Eje Y

// Variables de Control
int rc_roll = 1500;
int rc_pitch = 1500;
int rc_throttle = 1000; // Acelerador fijo para simulación

// Variables PID (Simplificado P-Controller)
float kp = 2.0; // Ganancia Proporcional
float error_roll = 0;
float error_pitch = 0;

void setup() {
  Serial.begin(115200);
  
  if (!mpu.begin()) {
    Serial.println("Fallo MPU6050");
    while (1);
  }
  
  // Configurar rangos para vuelo deportivo
  mpu.setAccelerometerRange(MPU6050_RANGE_8_G);
  mpu.setGyroRange(MPU6050_RANGE_500_DEG);
  mpu.setFilterBandwidth(MPU6050_BAND_21_HZ);
  
  Serial.println("--- MECRO FC ARMED ---");
}

void loop() {
  // 1. LEER INPUT DEL PILOTO (Joystick)
  // Convertir ADC (0-4095) a Estándar RC (1000-2000)
  // 1500 es el centro (stick suelto)
  rc_roll = map(analogRead(PIN_ROLL), 0, 4095, 1000, 2000);
  rc_pitch = map(analogRead(PIN_PITCH), 0, 4095, 1000, 2000);
  
  // 2. LEER REALIDAD (Sensores)
  sensors_event_t a, g, temp;
  mpu.getEvent(&a, &g, &temp);
  
  // Convertir aceleración a ángulo aproximado (simplificado)
  float angulo_roll_real = a.acceleration.y * 5.0; // aprox
  float angulo_pitch_real = a.acceleration.x * 5.0;

  // 3. CALCULAR ERROR (Setpoint - Realidad)
  // El piloto pide inclinación (ej. Roll=1800 -> +30 grados)
  // Convertir RC (1000-2000) a Grados (-45 a +45)
  float setpoint_roll = map(rc_roll, 1000, 2000, -45, 45);
  float setpoint_pitch = map(rc_pitch, 1000, 2000, -45, 45);
  
  error_roll = setpoint_roll - angulo_roll_real;
  error_pitch = setpoint_pitch - angulo_pitch_real;
  
  // 4. CALCULAR CORRECCIÓN (PID - Solo P)
  float pid_roll = error_roll * kp;
  float pid_pitch = error_pitch * kp;
  
  // 5. MIXER (Mezclador de Motores Quad X)
  // M1 (Front L) | M2 (Front R)
  // M4 (Back L)  | M3 (Back R)
  
  // Aumentamos throttle base para ver valores
  rc_throttle = 1300; 
  
  int m1 = rc_throttle + pid_pitch + pid_roll;
  int m2 = rc_throttle + pid_pitch - pid_roll;
  int m3 = rc_throttle - pid_pitch - pid_roll;
  int m4 = rc_throttle - pid_pitch + pid_roll;
  
  // Limitar valores a rango físico de ESC (1000-2000)
  m1 = constrain(m1, 1000, 2000);
  m2 = constrain(m2, 1000, 2000);
  m3 = constrain(m3, 1000, 2000);
  m4 = constrain(m4, 1000, 2000);
  
  // 6. SALIDA TELEMETRÍA (Serial Plotter)
  // Ideal para ver en el IDE de Arduino
  Serial.print("SetRoll:"); Serial.print(setpoint_roll);
  Serial.print(" RealRoll:"); Serial.print(angulo_roll_real);
  Serial.print(" M1:"); Serial.print(m1);
  Serial.print(" M2:"); Serial.println(m2);
  
  delay(10); // Loop a 100Hz aprox
}`,

            code: `/* * MECRO KIT - PROYECTO 18: MOUSE AÉREO (AIR MOUSE)
 * Objetivo: Bluetooth HID, Giroscopio y Filtrado
 * Librerías: BleMouse, Adafruit MPU6050
 * NOTA: Requiere instalar 'ESP32 BLE Mouse' de T-vK
 */

#include <BleMouse.h>
#include <Adafruit_MPU6050.h>
#include <Wire.h>

BleMouse bleMouse("MECRO Air Mouse", "MECRO Inc", 100);
Adafruit_MPU6050 mpu;

// Pines Botones
#define PIN_LEFT_CLICK 15
#define PIN_RIGHT_CLICK 4

// Configuración de Sensibilidad
const float SENSITIVITY = 15.0; // Multiplicador de velocidad
const float DEADZONE = 0.1;     // Rad/s mínimos para mover

void setup() {
  Serial.begin(115200);
  
  pinMode(PIN_LEFT_CLICK, INPUT_PULLUP);
  pinMode(PIN_RIGHT_CLICK, INPUT_PULLUP);

  if (!mpu.begin()) {
    Serial.println("Fallo MPU6050");
    while (1);
  }
  
  // Rango de Giroscopio: 500 grados/segundo es suficiente para manos humanas
  mpu.setGyroRange(MPU6050_RANGE_500_DEG);
  mpu.setFilterBandwidth(MPU6050_BAND_21_HZ);

  Serial.println("Iniciando Bluetooth...");
  bleMouse.begin();
}

void loop() {
  if (bleMouse.isConnected()) {
    
    // 1. LEER GIROSCOPIO
    sensors_event_t a, g, temp;
    mpu.getEvent(&a, &g, &temp);
    
    // g.gyro.z (Yaw) mueve el mouse en X (Horizontal)
    // g.gyro.y (Pitch) mueve el mouse en Y (Vertical) - Ajustar según orientación
    float gyroX = g.gyro.z; 
    float gyroY = g.gyro.y; // Puede requerir signo negativo
    
    // 2. APLICAR DEADZONE (Zona Muerta)
    if (abs(gyroX) < DEADZONE) gyroX = 0;
    if (abs(gyroY) < DEADZONE) gyroY = 0;
    
    // 3. CALCULAR MOVIMIENTO (Píxeles)
    // Invertimos signos según la orientación física del chip
    int moveX = -(gyroX * SENSITIVITY); 
    int moveY = -(gyroY * SENSITIVITY);
    
    // Mover solo si hay datos significativos
    if (moveX != 0 || moveY != 0) {
      bleMouse.move(moveX, moveY);
    }
    
    // 4. BOTONES (CLICS)
    // Lógica inversa (LOW = Presionado)
    if (digitalRead(PIN_LEFT_CLICK) == LOW) {
      if (!bleMouse.isPressed(MOUSE_LEFT)) bleMouse.press(MOUSE_LEFT);
    } else {
      if (bleMouse.isPressed(MOUSE_LEFT)) bleMouse.release(MOUSE_LEFT);
    }
    
    if (digitalRead(PIN_RIGHT_CLICK) == LOW) {
      if (!bleMouse.isPressed(MOUSE_RIGHT)) bleMouse.press(MOUSE_RIGHT);
    } else {
      if (bleMouse.isPressed(MOUSE_RIGHT)) bleMouse.release(MOUSE_RIGHT);
    }
    
    delay(10); // Fluidez de movimiento (100Hz)
  }
}`,

            code: `/* * MECRO KIT - PROYECTO 19: RIEGO WIFI IOT
 * Objetivo: Servidor Web, Lectura Analógica Capacitiva y Control de Relé
 * Hardware: ESP32, Sensor Humedad Suelo Capacitivo v1.2, Módulo Relé
 */

#include <WiFi.h>
#include <WebServer.h>

// --- CREDENCIALES WIFI ---
const char* ssid = "TU_WIFI_NOMBRE";
const char* password = "TU_WIFI_PASSWORD";

// --- DEFINICIONES DE HARDWARE ---
const int PIN_SENSOR = 34; // Entrada Analógica
const int PIN_RELE = 26;   // Salida Digital (Bomba)

// --- CALIBRACIÓN (IMPORTANTE) ---
// Valores experimentales: Sumergir en agua para MIN, secar al aire para MAX
const int AIRE_VAL = 3200; // Valor seco
const int AGUA_VAL = 1300; // Valor mojado

WebServer server(80);

// --- CÓDIGO HTML DEL DASHBOARD ---
// Guardamos la página web en una variable de texto
String getHTML(int humedad, String estado) {
  String html = "<!DOCTYPE html><html><head>";
  html += "<meta name='viewport' content='width=device-width, initial-scale=1'>";
  html += "<style>body{font-family:sans-serif;text-align:center;background:#1a1a1a;color:white;}";
  html += ".card{background:#2d2d2d;padding:20px;margin:20px auto;max-width:300px;border-radius:10px;}";
  html += "h1{color:#4ade80;} .val{font-size:3rem;font-weight:bold;}</style>";
  html += "<meta http-equiv='refresh' content='5'>"; // Refrescar cada 5s
  html += "</head><body>";
  html += "<h1>MECRO GARDEN IOT</h1>";
  html += "<div class='card'><p>Humedad del Suelo</p>";
  html += "<div class='val'>" + String(humedad) + "%</div>";
  html += "<p>Estado Bomba: <strong>" + estado + "</strong></p></div>";
  html += "</body></html>";
  return html;
}

void handleRoot() {
  int raw = analogRead(PIN_SENSOR);
  
  // Mapear valor inverso (Menos voltaje = Más humedad en capacitivos)
  int porcentaje = map(raw, AIRE_VAL, AGUA_VAL, 0, 100);
  porcentaje = constrain(porcentaje, 0, 100); // Limitar a 0-100%
  
  String estadoBomba = (digitalRead(PIN_RELE) == HIGH) ? "ENCENDIDA" : "APAGADA";
  
  server.send(200, "text/html", getHTML(porcentaje, estadoBomba));
}

void setup() {
  Serial.begin(115200);
  pinMode(PIN_RELE, OUTPUT);
  digitalWrite(PIN_RELE, LOW); // Apagar bomba al inicio

  // Conexión WiFi
  Serial.print("Conectando a WiFi");
  WiFi.begin(ssid, password);
  while (WiFi.status() != WL_CONNECTED) {
    delay(500);
    Serial.print(".");
  }
  
  Serial.println("");
  Serial.println("WiFi Conectado.");
  Serial.print("IP del Servidor: ");
  Serial.println(WiFi.localIP()); // ¡Entra aquí con tu navegador!

  // Rutas del Servidor
  server.on("/", handleRoot);
  server.begin();
}

void loop() {
  server.handleClient(); // Manejar peticiones web
  
  // Lógica de Riego Automático (Opcional)
  int raw = analogRead(PIN_SENSOR);
  int humedad = map(raw, AIRE_VAL, AGUA_VAL, 0, 100);
  
  // Si está muy seco (<20%), encender bomba
  // Nota: En producción, usaríamos millis() para no regar por horas si el sensor falla
  if (humedad < 20) {
     digitalWrite(PIN_RELE, HIGH);
  } else if (humedad > 60) {
     digitalWrite(PIN_RELE, LOW);
  }
}`,

                  <div id="deepdive20" class="reveal-content"><div class="reveal-inner p-6 pt-0 border-t border-yellow-900/20 bg-[#14120e]"><div class="prose max-w-none mt-6 text-sm"><h4>1. Jerarquía Stratum</h4><p>La red NTP es jerárquica. Stratum 0 son los relojes atómicos físicos (Cesio, Rubidio o GPS). Stratum 1 son servidores conectados directamente a ellos. Nosotros (el ESP32) somos Stratum 3 o 4. Cada nivel añade un pequeño error de milisegundos, pero es despreciable para uso humano.</p><h4>2. El Problema del Año 2038</h4><p>El Tiempo Unix se almacena tradicionalmente en una variable de 32 bits con signo. Su valor máximo es 2,147,483,647. Ese segundo exacto ocurrirá el 19 de enero de 2038. Un segundo después, los relojes de 32 bits se desbordarán a -2,147,483,648 (año 1901). El ESP32 moderno usa 64 bits para evitar este apocalipsis digital.</p></div></div></div>

                <div class="text-center w-full max-w-2xl"><div class="w-full h-48 bg-[#1a1d21] rounded flex items-center justify-center border border-[var(--line)] mb-6 text-[var(--text-dim)] font-mono text-sm">[Diagrama: Display TM1637 (CLK=18, DIO=19) + ESP32]</div>
                <p class="mb-4 text-white font-bold">Mapa de Conexiones</p>
                <div class="grid grid-cols-2 gap-3 mx-auto mb-6 text-left">
                   <div class="p-3 bg-[#13161a] border border-[var(--line)] rounded"><div class="text-white font-mono font-bold text-xs">GPIO 18</div><div class="text-[10px] text-[var(--text-dim)]">TM1637 CLK</div></div>
                   <div class="p-3 bg-[#13161a] border border-[var(--line)] rounded"><div class="text-white font-mono font-bold text-xs">GPIO 19</div><div class="text-[10px] text-[var(--text-dim)]">TM1637 DIO</div></div>
                   <div class="p-3 bg-[#13161a] border border-[var(--line)] rounded"><div class="text-red-400 font-mono font-bold text-xs">3.3V / 5V</div><div class="text-[10px] text-[var(--text-dim)]">VCC Display</div></div>
                   <div class="p-3 bg-[#13161a] border border-[var(--line)] rounded"><div class="text-blue-400 font-mono font-bold text-xs">GND</div><div class="text-[10px] text-[var(--text-dim)]">Tierra Común</div></div>

            `,
            code: `/* * MECRO KIT - PROYECTO 20: RELOJ ATÓMICO NTP
 * Objetivo: Sincronización de tiempo vía Internet (WiFi)
 * Hardware: ESP32, Display TM1637
 * Librerías: TM1637Display, WiFi.h, time.h
 */

#include <WiFi.h>
#include "time.h"
#include <TM1637Display.h>

// --- CONFIGURACIÓN DE RED ---
const char* ssid     = "TU_WIFI_NOMBRE";
const char* password = "TU_WIFI_PASSWORD";

// --- CONFIGURACIÓN NTP (Perú: UTC-5) ---
const char* ntpServer = "pool.ntp.org";
const long  gmtOffset_sec = -18000;   // UTC -5 * 3600
const int   daylightOffset_sec = 0;   // Sin horario de verano

// --- DISPLAY ---
const int CLK = 18;
const int DIO = 19;
TM1637Display display(CLK, DIO);

void setup() {
  Serial.begin(115200);
  display.setBrightness(0x0f);
  
  // Animación de carga mientras conecta
  const uint8_t SEG_CONN[] = {
    SEG_A | SEG_D | SEG_E | SEG_F, // C
    SEG_A | SEG_B | SEG_C | SEG_D | SEG_E | SEG_F, // O
    SEG_C | SEG_E | SEG_G, // n
    SEG_C | SEG_E | SEG_G  // n
  };
  display.setSegments(SEG_CONN);

  // Conectar WiFi
  WiFi.begin(ssid, password);
  while (WiFi.status() != WL_CONNECTED) {
    delay(500);
    Serial.print(".");
  }
  Serial.println("\nWiFi Conectado!");

  // Iniciar cliente de tiempo
  configTime(gmtOffset_sec, daylightOffset_sec, ntpServer);
}

void loop() {
  struct tm timeinfo;
  
  // Intentar obtener hora local
  if(!getLocalTime(&timeinfo)){
    Serial.println("Error obteniendo hora NTP");
    return;
  }
  
  // Extraer hora y minutos
  int hora = timeinfo.tm_hour;
  int minutos = timeinfo.tm_min;
  
  // Formato 12H (Opcional)
  // if (hora > 12) hora -= 12;
  // if (hora == 0) hora = 12;

  // Calcular número para display: 1230 -> 12:30
  int displayTime = (hora * 100) + minutos;
  
  // Parpadeo de los dos puntos (:) cada segundo
  // El TM1637 muestra los puntos si activamos el bit central
  // 0x40 es el bit de los dos puntos en algunos modelos, 
  // o usamos el segundo argumento de showNumberDecEx
  
  bool parpadeo = (timeinfo.tm_sec % 2 == 0);
  
  // showNumberDecEx(numero, puntos, ceros_izquierda)
  // 0b01000000 (0x40) activa los dos puntos centrales
  display.showNumberDecEx(displayTime, (parpadeo ? 0x40 : 0), true);
  
  delay(500);
}`,
            sim: "" 
        }
        // ---------------FIN DE PÁGINAS---------------
    };
    
    // --- LISTA DE NAVEGACIÓN (CONFIGURACIÓN DE NIVELES) ---
    const navStructure = [
        { title: "Nivel 1: Iniciación", projects: [1, 2, 3, 4, 5] },
        { title: "Nivel 2: Pantallas", projects: [6, 7, 8, 9, 10] },
        { title: "Nivel 3: Robótica", projects: [11, 12, 13, 14, 15] },
        { title: "Nivel 4: Drones & IoT", projects: [16, 17, 18, 19, 20] }
    ];

    // Nombres placeholder para los proyectos futuros
    const projectNames = {
        6: "Huicha Digital", 7: "Estación Clima", 8: "Caja Fuerte", 9: "Detector Intrusos", 10: "Ventilador Smart",
        11: "Radar Exploración", 12: "Brazo Robótico", 13: "Base Cámara", 14: "Ascensor 3 Pisos", 15: "Control Industrial",
        16: "Nivel Digital", 17: "Mando Vuelo", 18: "Mouse Aéreo", 19: "Riego IoT", 20: "Reloj NTP"
    };

    // --- ENGINE LÓGICO ---
    let currentProjectId = 1;

    function init() {
        const navContainer = document.getElementById('sidebar-nav');
        navContainer.innerHTML = '';

        navStructure.forEach(level => {
            // Header de Nivel
            const lvlHeader = document.createElement('div');
            lvlHeader.className = "px-2 pb-2 mt-6 text-[10px] font-bold uppercase tracking-wider opacity-90 border-b border-[var(--line)] mb-2 text-[var(--accent)]";
            lvlHeader.innerText = level.title;
            navContainer.appendChild(lvlHeader);

            // Links de Proyectos
            level.projects.forEach(pid => {
                const link = document.createElement('div');
                const isLocked = !projectDB[pid]; // Bloqueado si no está en la DB
                
                let classes = "nav-link";
                if(pid === currentProjectId) classes += " active";
                if(isLocked) classes += " locked";

                link.className = classes;
                link.innerHTML = `<span class="font-mono text-xs opacity-50">${pid < 10 ? '0'+pid : pid}.</span> ${projectDB[pid]?.title.substring(4) || projectNames[pid]}`;
                
                if(isLocked) link.innerHTML += `<i class="ph-fill ph-lock-key ml-auto text-xs"></i>`;
                
                if(!isLocked) {
                    link.onclick = () => loadProject(pid);
                }
                
                navContainer.appendChild(link);
            });
        });
        
        loadProject(1); // Cargar proyecto 1 al inicio
    }

    function loadProject(id) {
        currentProjectId = id;
        const data = projectDB[id];
        
        // Update UI
        document.getElementById('p-badge').innerText = data.level;
        document.getElementById('p-title').innerText = data.title;
        document.getElementById('p-desc').innerHTML = data.desc;
        
        document.getElementById('content-theory').innerHTML = data.theory;
        document.getElementById('content-circuit').innerHTML = data.circuit;
        
        // Escape HTML for code display
        const escapedCode = data.code.replace(/</g, "&lt;").replace(/>/g, "&gt;");
        
        // Robust Syntax Highlighting
        let highlighted = escapedCode
            .replace(/(const|int|void|unsigned long|byte|bool|uint8_t|long|float|#define|#include|char|String)/g, '<span class="c-t">$1</span>')
            .replace(/(\/\/.*)/g, '<span class="c-c">$1</span>');
            
        // Use regex constructor to avoid literal syntax errors with specific keywords
        const keywords = ["setup", "loop", "pinMode", "digitalWrite", "delay", "millis", "Serial", "begin", "println", "ledcSetup", "ledcAttachPin", "ledcWriteTone", "shiftOut", "INPUT_PULLUP", "LOW", "HIGH", "OUTPUT", "ledcWrite", "analogRead", "print", "MSBFIRST", "randomSeed", "random", "bitRead", "while", "pulseIn", "delayMicroseconds", "setBrightness", "showNumberDec", "setSegments", "INPUT", "dht", "display", "isnan", "drawCircle", "setTextSize", "setTextColor", "setCursor", "clearDisplay", "Wire", "tone", "checkPassword", "getKey", "makeKeymap"];
        const keywordRegex = new RegExp(`\\b(${keywords.join("|")})\\b`, 'g');
        
        highlighted = highlighted.replace(keywordRegex, '<span class="c-f">$1</span>');

        document.getElementById('code-display').innerHTML = `<pre>${highlighted}</pre>`;
        
        // Sim Frame
        const simFrame = document.getElementById('sim-frame');
        const simPlace = document.getElementById('sim-placeholder');
        if(data.sim) {
            simFrame.src = data.sim;
            simFrame.classList.remove('hidden');
            simPlace.classList.add('hidden');
        } else {
            simFrame.classList.add('hidden');
            simPlace.classList.remove('hidden');
        }

        // Re-render Nav to update active state
        const links = document.querySelectorAll('.nav-link');
        links.forEach(l => {
           l.classList.remove('active');
           if(l.innerText.includes(`${id < 10 ? '0'+id : id}.`)) l.classList.add('active');
        });
    }

    // Tabs Logic
    function switchTab(tabId) {
        ['theory', 'circuit', 'code', 'sim'].forEach(id => {
            document.getElementById('content-' + id).classList.add('hidden');
            document.getElementById('tab-' + id).classList.remove('active');
        });
        document.getElementById('content-' + tabId).classList.remove('hidden');
        document.getElementById('tab-' + tabId).classList.add('active');
    }

    // Accordion
    function toggleAccordion(id) {
        const el = document.getElementById(id);
        if (el.classList.contains('open')) el.classList.remove('open');
        else el.classList.add('open');
    }

    // Copy Code
    function copyCode() {
        const codeText = projectDB[currentProjectId].code;
        navigator.clipboard.writeText(codeText).then(() => alert("Código copiado al portapapeles"));
    }

    // Boot
    init();

  </script>
</body>
