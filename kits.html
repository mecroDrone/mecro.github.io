    .tab-btn:hover { color: var(--text-main); background-color: rgba(255,255,255,0.03); }
    .tab-btn.active { color: var(--accent); background-color: rgba(16, 185, 129, 0.05); }

    .reveal-content { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 0.4s ease; opacity: 0.5; }

const int P_RED = 23;
const int P_YEL = 22;
const int P_GRN = 21;

unsigned long prevTime = 0;
int state = 0; // 0:R, 1:G, 2:Y

void setup() {
  pinMode(P_RED, OUTPUT);
  pinMode(P_YEL, OUTPUT);
  pinMode(P_GRN, OUTPUT);
}

void loop() {
  unsigned long now = millis();
  
  switch(state) {
    case 0: // ROJO
      digitalWrite(P_RED, HIGH); digitalWrite(P_YEL, LOW); digitalWrite(P_GRN, LOW);
      if(now - prevTime >= 3000) { state = 1; prevTime = now; }
      break;
      
    case 1: // VERDE
      digitalWrite(P_RED, LOW); digitalWrite(P_YEL, LOW); digitalWrite(P_GRN, HIGH);
      if(now - prevTime >= 3000) { state = 2; prevTime = now; }
      break;

    case 2: // AMARILLO
      digitalWrite(P_RED, LOW); digitalWrite(P_YEL, HIGH); digitalWrite(P_GRN, LOW);
      if(now - prevTime >= 1000) { state = 0; prevTime = now; }
      break;
  }
}`,

            code: `/* * MECRO KIT - PROYECTO 02: PIANO ELECTRÓNICO
 * Objetivo: Generación de ondas cuadradas (Sonido) usando PWM (LEDC)
 * Hardware: ESP32, Buzzer Pasivo, 3 Pulsadores
 */

// --- 1. DEFINICIONES DE PINES ---
const int PIN_BUZZER = 19;
const int BTN_DO = 4;
const int BTN_RE = 5;
const int BTN_MI = 18;

// --- 2. FRECUENCIAS MUSICALES (Hertz) ---
// Escala 4 (Octava Central)
const int NOTA_DO = 261;
const int NOTA_RE = 294;
const int NOTA_MI = 329;

// --- 3. CONFIGURACIÓN PWM (LEDC) ---
const int CANAL_PWM = 0;      // El ESP32 tiene 16 canales (0-15)
const int FREC_BASE = 2000;   // Frecuencia inicial (no importa mucho, la cambiaremos)
const int RESOLUCION = 8;     // 8 bits (0-255)

void setup() {
  // Configurar botones con resistencia interna (Pull-Up)
  // Al presionar, el pin leerá LOW (GND)
  pinMode(BTN_DO, INPUT_PULLUP);
  pinMode(BTN_RE, INPUT_PULLUP);
  pinMode(BTN_MI, INPUT_PULLUP);

  // Configurar el periférico de LED Control (LEDC)
  ledcSetup(CANAL_PWM, FREC_BASE, RESOLUCION);
  
  // Conectar el canal al pin del buzzer
  ledcAttachPin(PIN_BUZZER, CANAL_PWM);
  
  Serial.begin(115200);
  Serial.println("MECRO Piano Iniciado");
}

void loop() {
  // Leemos los botones (Lógica Inversa: LOW = Presionado)
  
  if (digitalRead(BTN_DO) == LOW) {
    // Tocar DO: Frecuencia 261Hz
    ledcWriteTone(CANAL_PWM, NOTA_DO);
    Serial.println("Nota: DO");
  } 
  else if (digitalRead(BTN_RE) == LOW) {
    ledcWriteTone(CANAL_PWM, NOTA_RE);
    Serial.println("Nota: RE");
  }
  else if (digitalRead(BTN_MI) == LOW) {
    ledcWriteTone(CANAL_PWM, NOTA_MI);
    Serial.println("Nota: MI");
  }
  else {
    // Silencio: Frecuencia 0
    ledcWriteTone(CANAL_PWM, 0);
  }
  
  // Pequeño delay para estabilidad (Debounce simple)
  delay(10);
}`,

  // Configurar pines como salida

  pinMode(PIN_LATCH, OUTPUT);
  pinMode(PIN_CLOCK, OUTPUT);
  
  Serial.begin(115200);
  Serial.println("Sistema Knight Rider Iniciado");
}

// Función auxiliar para enviar el byte al chip
void actualizarRegistro() {
   // 1. Bajamos el Latch para empezar a enviar datos (Puerta cerrada)
   digitalWrite(PIN_LATCH, LOW);
   
   // 2. Enviamos el byte completo bit a bit (MSBFIRST = Bit más significativo primero)
   shiftOut(PIN_DATA, PIN_CLOCK, MSBFIRST, leds);
   
   // 3. Subimos el Latch para mostrar los datos en los LEDs (Puerta abierta)
   digitalWrite(PIN_LATCH, HIGH);
}

void loop() {
  // EFECTO: Ida (Izquierda a Derecha)
  for (int i = 0; i < 8; i++) {
    leds = 1 << i; // Operación Bitwise Shift: Mueve el '1' i posiciones
    actualizarRegistro();
    delay(100); // Velocidad del efecto
  }
  
  // EFECTO: Vuelta (Derecha a Izquierda)
  for (int i = 7; i >= 0; i--) {
    leds = 1 << i;
    actualizarRegistro();
    delay(100);
  }
}`,

// --- 1. DEFINICIÓN DE PINES (A, B, C, D, E, F, G) ---
// Usamos un Array para guardar los pines en orden
const int segmentPins[] = {13, 12, 14, 27, 26, 25, 33};
const int PIN_BUTTON = 4;

// --- 2. MAPA DE BITS (LOOKUP TABLE) ---
// Cada byte representa un número del 0 al 9.
// 1 = Encendido, 0 = Apagado. Orden: G F E D C B A (Depende de tu cableado)
// Aquí asumimos orden de array: A, B, C, D, E, F, G
const byte digits[10] = {
  // A B C D E F G
  0b1111110, // 0
  0b0110000, // 1
  0b1101101, // 2
  0b1111001, // 3
  0b0110011, // 4
  0b1011011, // 5
  0b1011111, // 6
  0b1110000, // 7
  0b1111111, // 8
  0b1111011  // 9
};

void setup() {
  // Configurar todos los pines de segmentos como salida
  for (int i = 0; i < 7; i++) {
    pinMode(segmentPins[i], OUTPUT);
  }
  
  pinMode(PIN_BUTTON, INPUT_PULLUP);
  
  // SEMILLA DE CAOS: Leer ruido analógico para que sea aleatorio de verdad
  randomSeed(analogRead(0));
  
  Serial.begin(115200);
  Serial.println("Dado Digital Listo. Agita (Pulsa) para lanzar.");
  mostrarNumero(0); // Mostrar 0 al inicio
}

void loop() {
  if (digitalRead(PIN_BUTTON) == LOW) { // Si se pulsa
    efectoRodar();
    
    int resultado = random(1, 7); // Número entre 1 y 6
    Serial.print("Resultado: ");
    Serial.println(resultado);
    
    mostrarNumero(resultado);
    
    // Esperar a que se suelte para no repetir
    while(digitalRead(PIN_BUTTON) == LOW); 
    delay(200); // Debounce
  }
}

// Función auxiliar para encender los segmentos correctos
void mostrarNumero(int num) {
  byte patron = digits[num]; // Obtener el mapa de bits
  
  for (int i = 0; i < 7; i++) {
    // bitRead lee el bit en la posición i.
    // Nota: Dependiendo de tu tabla binaria, puede que necesites leer al revés
    // Aquí asumimos bit 0 = G, bit 6 = A (o ajusta según tu tabla)
    // Para simplificar, escribimos:
    int estado = bitRead(patron, 6 - i); 
    digitalWrite(segmentPins[i], estado);
  }
}

// Efecto visual de "calculando"
void efectoRodar() {
  for (int i = 0; i < 10; i++) {
    mostrarNumero(random(1, 7));
    delay(50 + (i * 20)); // Se va haciendo más lento
  }
}`,
